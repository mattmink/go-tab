<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Few items, largest tiles</title>
<link rel="stylesheet" href="../speeddial.css">
<style>body{margin:0}
a{color:inherit}a:hover{color:inherit}</style>
</head>
<body>
<main class="nt bg-default sz-xl" style="width: 1440px; height: 900px">
<div class="toolbar">
<button class="iconbtn" type="button" aria-label="Edit layout"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" /></svg></button>
<button class="iconbtn" type="button" aria-label="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg></button>
</div>
<div class="stage">
<div class="groups">

<section class="group" aria-label="Work">
<h2 class="gh">Work</h2>
<div class="tiles">

<div class="tw"><a class="tile" href="https://mail.google.com" title="Gmail"><span class="ico" style="background: #C5443A" aria-hidden="true">G</span><span class="tl"><span class="tt">Gmail</span><span class="dm">mail.google.com</span></span></a></div>

<div class="tw"><a class="tile" href="https://calendar.google.com" title="Calendar"><span class="ico" style="background: #2F6FD6" aria-hidden="true">C</span><span class="tl"><span class="tt">Calendar</span><span class="dm">calendar.google.com</span></span></a></div>

<div class="tw"><a class="tile" href="https://app.slack.com" title="Slack"><span class="ico" style="background: #4A1D5E" aria-hidden="true">S</span><span class="tl"><span class="tt">Slack</span><span class="dm">app.slack.com</span></span></a></div>

<div class="tw"><a class="tile" href="https://github.com" title="GitHub"><span class="ico" style="background: #24292F" aria-hidden="true">G</span><span class="tl"><span class="tt">GitHub</span><span class="dm">github.com</span></span></a></div>

</div>
</section>

<section class="group" aria-label="Personal">
<h2 class="gh">Personal</h2>
<div class="tiles">

<div class="tw"><a class="tile" href="https://youtube.com" title="YouTube"><span class="ico" style="background: #C21C13" aria-hidden="true">Y</span><span class="tl"><span class="tt">YouTube</span><span class="dm">youtube.com</span></span></a></div>

<div class="tw"><a class="tile" href="https://chase.com" title="Chase"><span class="ico" style="background: #0F5E9C" aria-hidden="true">C</span><span class="tl"><span class="tt">Chase</span><span class="dm">chase.com</span></span></a></div>

<div class="tw"><a class="tile" href="https://weather.com" title="Weather"><span class="ico" style="background: #B87405" aria-hidden="true">W</span><span class="tl"><span class="tt">Weather</span><span class="dm">weather.com</span></span></a></div>

</div>
</section>

</div>
</div>
</main>
</body>
</html>
